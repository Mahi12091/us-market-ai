name: Free Missing Quote Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_missing_quotes_yahoo.mjs'
      - '.github/workflows/free-missing-quote-backfill.yml'
  schedule:
    - cron: '10 7 * * *'

permissions:
  contents: read

concurrency:
  group: free-missing-quote-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Validate database connection
        run: test -n "$NEON_DATABASE_URL"
      - name: Backfill missing quote rows from free Yahoo chart history
        run: node scripts/backfill_missing_quotes_yahoo.mjs
