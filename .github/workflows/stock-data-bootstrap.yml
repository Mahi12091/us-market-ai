name: Stock Data Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      # Compatibility layer for legacy scripts: all Supabase REST calls are
      # transparently routed to the Neon database by the local proxy below.
      SUPABASE_URL: http://127.0.0.1:8787
      SUPABASE_SERVICE_ROLE_KEY: neon-local-proxy
      SEC_USER_AGENT: 'US Market AI research bot (GitHub: Mahi12091/us-market-ai)'
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in MASSIVE_API_KEY NEON_DATABASE_URL SEC_CONTACT_EMAIL; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured."; exit 1; fi
          done

      - name: Ensure Neon schema is current
        run: node scripts/migrate_neon.mjs

      - name: Start Neon REST compatibility proxy
        run: |
          nohup node scripts/neon-rest-proxy.mjs > /tmp/neon-rest.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/rest/v1/stocks?limit=1 >/dev/null; then
              echo "[neon-rest] proxy ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/rest/v1/stocks?limit=1 >/dev/null

      - name: Seed US stock universe
        run: node scripts/seed_us_stock_universe.mjs

      - name: Enrich stock metadata once
        run: node scripts/enrich_stock_metadata.mjs

      - name: Sync fundamentals from FMP (primary)
        run: node scripts/sync_fundamentals_fmp.mjs

      - name: Sync missing fundamentals from SEC (fallback)
        env:
          FUNDAMENTALS_SYMBOLS_FILE: .fmp_fallback_symbols.json
        run: node scripts/sync_fundamentals_v2.mjs

      - name: Sync earnings (optional Massive/Benzinga)
        continue-on-error: true
        run: node scripts/sync_earnings.mjs

      - name: Sync missing fundamentals from Alpha Vantage (fallback)
        env:
          FUNDAMENTALS_SYMBOLS_FILE: .fmp_fallback_symbols.json
        continue-on-error: true
        run: node scripts/sync_fundamentals_alpha_vantage.mjs

      - name: Sync dividends
        run: node scripts/sync_dividends.mjs

      - name: Calculate technical indicators
        run: node scripts/compute_technical_indicators.mjs

      - name: Generate quantitative predictions
        run: node scripts/generate_predictions.mjs
