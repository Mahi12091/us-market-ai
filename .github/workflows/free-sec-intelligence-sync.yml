name: Free SEC Intelligence Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-sec-intelligence-sync.yml'
      - 'scripts/sync_sec_free_bulk_v3.mjs'
      - 'scripts/sync_sec_insider_free_v2.mjs'
      - 'scripts/sync_sec_13f_dataset.mjs'
      - 'scripts/audit_sec_coverage.mjs'
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

concurrency:
  group: sec-intelligence-sync
  cancel-in-progress: true

jobs:
  sec-bulk-xbrl:
    name: SEC bulk + XBRL
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SEC_BATCH_SIZE: 500
      SEC_BATCH_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Download once, parse locally, parallel DB batches
        run: node scripts/sync_sec_free_bulk_v3.mjs

  sec-insider:
    name: SEC insider transactions
    needs: sec-bulk-xbrl
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SEC_INSIDER_DAYS: 180
      SEC_INSIDER_MAX: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: SEC insider transactions
        run: node scripts/sync_sec_insider_free_v2.mjs

  sec-13f-dataset:
    name: Official SEC 13F dataset
    needs: sec-bulk-xbrl
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Ingest official quarterly 13F dataset
        run: node scripts/sync_sec_13f_dataset.mjs

  sec-coverage-audit:
    name: SEC coverage audit
    needs: [sec-bulk-xbrl, sec-insider, sec-13f-dataset]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Audit SEC coverage
        run: node scripts/audit_sec_coverage.mjs
