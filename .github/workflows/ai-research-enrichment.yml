name: AI Research Enrichment
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-research-enrichment.yml'
      - 'scripts/generate_ai_research.mjs'
      - 'scripts/generate_ai_articles.mjs'
jobs:
  ai-research:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEON_REST_URL: http://127.0.0.1:8787
      NEON_API_KEY: neon-local
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Start Neon REST API
        run: |
          nohup node scripts/neon-rest-api.mjs > /tmp/neon-rest.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8787/rest/v1/stocks?limit=1' >/dev/null 2>&1; then echo '[neon-rest] API ready'; exit 0; fi
            sleep 1
          done
          cat /tmp/neon-rest.log
          exit 1
      - name: Generate monthly AI research
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          AI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_REQUEST_DELAY_MS: 1000
        run: node scripts/generate_ai_research.mjs monthly
      - name: Generate quarterly AI research
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          AI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_REQUEST_DELAY_MS: 1000
        run: node scripts/generate_ai_research.mjs quarterly
      - name: Generate premium articles batch
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ARTICLE_BATCH_SIZE: 25
        run: node scripts/generate_ai_articles.mjs
      - name: Explain skipped AI generation
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo 'AI generation skipped because OPENAI_API_KEY is not configured. Rule-based research backfill runs separately.'
