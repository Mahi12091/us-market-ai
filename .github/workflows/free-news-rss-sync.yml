name: Free RSS News Backfill
on:
  workflow_dispatch:
concurrency:
  group: free-news-rss-sync
  cancel-in-progress: false
jobs:
  sync-free-news:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEWS_USER_AGENT: 'USMarketAI/1.0 contact: support@usmarketai.com'
      FREE_NEWS_STOCKS_PER_RUN: 500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node scripts/sync_news_free_rss.mjs
