name: Reference Metadata Sync

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in MASSIVE_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "\${!name:-}" ]; then echo "$name is not configured."; exit 1; fi
          done

      - name: Seed US stock universe
        run: node scripts/seed_us_stock_universe.mjs

      - name: Enrich stock metadata
        run: node scripts/enrich_stock_metadata.mjs
