name: Reference Metadata Sync

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/seed_us_stock_universe.mjs'
      - 'scripts/enrich_stock_metadata.mjs'
      - '.github/workflows/reference-metadata-sync.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in MASSIVE_API_KEY NEON_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured."; exit 1; fi
          done

      - name: Apply current Neon schema
        run: node scripts/migrate_neon.mjs

      - name: Seed / refresh 2,000-stock universe
        run: node scripts/seed_us_stock_universe.mjs

      - name: Enrich stock metadata
        continue-on-error: true
        run: node scripts/enrich_stock_metadata.mjs

      - name: Verify stock universe
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.NEON_DATABASE_URL);
          const rows = await sql.query("SELECT COUNT(*) FILTER (WHERE asset_type='stock') AS stocks, COUNT(*) FILTER (WHERE asset_type='stock' AND is_active) AS active_stocks, COUNT(*) FILTER (WHERE asset_type='stock' AND is_active AND is_indexable) AS active_indexable, COUNT(DISTINCT symbol) AS distinct_symbols FROM public.stocks");
          console.log(JSON.stringify(rows[0], null, 2));
          NODE
