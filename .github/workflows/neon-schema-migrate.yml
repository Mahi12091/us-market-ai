name: Neon Schema Migrate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/migrate_neon.mjs'
      - 'package.json'

permissions:
  contents: read

env:
  NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Neon connection
        run: node -e "if (!process.env.NEON_DATABASE_URL) process.exit(1); console.log('[neon] connection secret present')"
      - name: Apply Neon schema
        run: node scripts/migrate_neon.mjs
