name: Wikipedia + Wikidata Stock Metadata Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/enrich_stock_metadata_wikidata.mjs'
      - '.github/workflows/wikidata-stock-metadata.yml'

permissions:
  contents: read

concurrency:
  group: us-market-ai-wikidata-metadata
  cancel-in-progress: true

jobs:
  enrich:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate database secret
        run: |
          if [ -z "${NEON_DATABASE_URL:-}" ]; then
            echo "NEON_DATABASE_URL is not configured."
            exit 1
          fi

      - name: Enrich missing metadata from Wikipedia and Wikidata entity search
        run: node scripts/enrich_stock_metadata_wikidata.mjs
