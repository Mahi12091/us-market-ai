name: Free SEC Data Sync (legacy)
on:
  workflow_dispatch:
jobs:
  sec-bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Sync legacy SEC bulk data
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_MODE: all
        run: node scripts/sync_sec_free_bulk.mjs
