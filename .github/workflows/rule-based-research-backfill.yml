name: Rule-Based Research Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_rule_based_research.mjs'
      - '.github/workflows/rule-based-research-backfill.yml'
  schedule:
    - cron: '20 6 * * *'

concurrency:
  group: rule-based-research-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Validate database secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Populate missing research using verified data only
        run: node scripts/generate_rule_based_research.mjs
