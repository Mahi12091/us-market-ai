name: Derived Fundamentals Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/calculate_derived_fundamentals.mjs'
      - 'scripts/generate_rule_based_research.mjs'
      - '.github/workflows/derived-fundamentals.yml'
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: read

jobs:
  calculate:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Neon connection
        run: test -n "$NEON_DATABASE_URL"
      - name: Calculate derived fundamentals
        run: npm run calculate:derived
