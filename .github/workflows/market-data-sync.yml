name: Market Data Sync

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in MASSIVE_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not configured in GitHub repository secrets."
              exit 1
            fi
          done
          echo "Required secrets are configured."

      - name: Sync Massive directly to Supabase
        run: node scripts/sync_market_data.mjs

      - name: Calculate technical indicators
        run: node scripts/compute_technical_indicators.mjs

      - name: Generate quantitative predictions
        run: node scripts/generate_predictions.mjs
