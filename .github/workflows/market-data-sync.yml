name: Market Data Sync

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEON_REST_URL: http://127.0.0.1:8787
      NEON_API_KEY: neon-local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Neon connection
        run: test -n "${NEON_DATABASE_URL:-}"
      - name: Start Neon REST API
        run: |
          set -euo pipefail
          nohup node scripts/neon-rest-api.mjs > /tmp/neon-rest.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/rest/v1/stocks?limit=1 >/dev/null 2>&1; then echo "[neon-rest] API ready"; exit 0; fi
            sleep 1
          done
          cat /tmp/neon-rest.log
          exit 1
      - name: Refresh 2,000-stock universe
        run: node scripts/seed_us_stock_universe.mjs
      - name: Sync Massive market data
        continue-on-error: true
        run: node scripts/sync_market_data.mjs
      - name: Calculate technical indicators
        continue-on-error: true
        run: node scripts/compute_technical_indicators.mjs
      - name: Evaluate mature predictions
        continue-on-error: true
        run: node scripts/evaluate_predictions.mjs
      - name: Sync news and sentiment
        continue-on-error: true
        run: node scripts/sync_news.mjs
      - name: Generate quantitative predictions
        continue-on-error: true
        run: node scripts/generate_predictions.mjs
