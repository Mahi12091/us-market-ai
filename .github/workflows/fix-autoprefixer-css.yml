name: Fix Autoprefixer CSS warnings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace CSS logical end values
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('app/globals.css'),
              Path('app/market-pages.css'),
              Path('app/predictions-page.css'),
              Path('app/search/search.css'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('align-items:end', 'align-items:flex-end')
              text = text.replace('justify-content:end', 'justify-content:flex-end')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit CSS fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css app/market-pages.css app/predictions-page.css app/search/search.css
          git rm .github/workflows/fix-autoprefixer-css.yml
          if git diff --cached --quiet; then
            echo 'No CSS changes required.'
            exit 0
          fi
          git commit -m 'fix: remove Autoprefixer end-value warnings'
          git push
