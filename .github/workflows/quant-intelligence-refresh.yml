name: Quant Intelligence Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh stock scores and rankings
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node scripts/generate_stock_scores.mjs
