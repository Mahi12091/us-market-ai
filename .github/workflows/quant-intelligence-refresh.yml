name: Quant Intelligence Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/quant-intelligence-refresh.yml'
      - 'scripts/generate_stock_scores_v2.mjs'
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Refresh stock scores and rankings
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node scripts/generate_stock_scores_v2.mjs
