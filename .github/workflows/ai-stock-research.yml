name: AI Stock Research

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Research mode'
        required: true
        default: monthly
        type: choice
        options:
          - monthly
          - quarterly

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SUPABASE_URL: http://127.0.0.1:8787
      SUPABASE_SERVICE_ROLE_KEY: neon-local-proxy
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openai' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-5-mini' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_REQUEST_DELAY_MS: '750'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate secrets
        run: |
          set -euo pipefail
          test -n "${NEON_DATABASE_URL:-}" || (echo "NEON_DATABASE_URL missing" && exit 1)
          case "${AI_PROVIDER:-openai}" in
            openai) test -n "${OPENAI_API_KEY:-}" || (echo "OPENAI_API_KEY missing" && exit 1) ;;
            claude) test -n "${ANTHROPIC_API_KEY:-}" || (echo "ANTHROPIC_API_KEY missing" && exit 1) ;;
            deepseek) test -n "${DEEPSEEK_API_KEY:-}" || (echo "DEEPSEEK_API_KEY missing" && exit 1) ;;
            *) echo "Unsupported AI_PROVIDER"; exit 1 ;;
          esac
      - name: Start Neon REST compatibility layer
        run: |
          set -euo pipefail
          nohup node scripts/neon-rest-proxy.mjs > /tmp/neon-rest.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/rest/v1/stocks?limit=1 >/dev/null 2>&1; then
              echo "[neon-rest] proxy ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/neon-rest.log
          exit 1
      - name: Run monthly research
        if: github.event_name == 'schedule' || inputs.mode == 'monthly'
        continue-on-error: true
        run: node scripts/generate_ai_research.mjs monthly
      - name: Run quarterly research
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'quarterly'
        continue-on-error: true
        run: node scripts/generate_ai_research.mjs quarterly
