name: AI Stock Research

on:
  schedule:
    - cron: '0 2 1 * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-stock-research.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Research mode'
        required: true
        default: monthly
        type: choice
        options:
          - monthly
          - quarterly

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEON_REST_URL: http://127.0.0.1:8787
      NEON_API_KEY: neon-local
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openai' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-5-mini' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_REQUEST_DELAY_MS: '750'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate secrets
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEON_DATABASE_URL:-}" || (echo "NEON_DATABASE_URL missing" && exit 1)
          ready=false
          case "${AI_PROVIDER:-openai}" in
            openai) [ -n "${OPENAI_API_KEY:-}" ] && ready=true ;;
            claude) [ -n "${ANTHROPIC_API_KEY:-}" ] && ready=true ;;
            deepseek) [ -n "${DEEPSEEK_API_KEY:-}" ] && ready=true ;;
            *) echo "Unsupported AI_PROVIDER"; exit 1 ;;
          esac
          echo "ai_ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then echo "No configured AI provider key; rule-based research backfill will provide non-AI research." ; fi
      - name: Start Neon REST API
        if: steps.validate.outputs.ai_ready == 'true'
        run: |
          set -euo pipefail
          nohup node scripts/neon-rest-api.mjs > /tmp/neon-rest.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/rest/v1/stocks?limit=1 >/dev/null 2>&1; then echo "[neon-rest] API ready"; exit 0; fi
            sleep 1
          done
          cat /tmp/neon-rest.log
          exit 1
      - name: Skip AI research when provider key is missing
        if: steps.validate.outputs.ai_ready != 'true'
        run: echo 'AI research skipped: configure the selected provider API key to enable AI-generated text. Verified rule-based research is maintained by a separate workflow.'
      - name: Run monthly research
        if: steps.validate.outputs.ai_ready == 'true' && (github.event_name == 'schedule' || inputs.mode == 'monthly')
        continue-on-error: true
        run: node scripts/generate_ai_research.mjs monthly
      - name: Run quarterly research
        if: steps.validate.outputs.ai_ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'quarterly'
        continue-on-error: true
        run: node scripts/generate_ai_research.mjs quarterly
