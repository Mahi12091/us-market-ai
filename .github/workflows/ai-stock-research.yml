name: AI Stock Research

on:
  schedule:
    - cron: '0 2 1 * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-stock-research.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Research mode'
        required: true
        default: monthly
        type: choice
        options:
          - monthly
          - quarterly

permissions:
  contents: read

jobs:
  research:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEON_REST_URL: http://127.0.0.1:8787
      NEON_API_KEY: neon-local
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openai' }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-5-mini' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_REQUEST_DELAY_MS: '750'
      RESEARCH_MODE: ${{ github.event.inputs.mode || 'monthly' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run AI research if provider credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEON_DATABASE_URL:-}" || { echo "NEON_DATABASE_URL missing"; exit 1; }
          case "${AI_PROVIDER:-openai}" in
            openai) AI_KEY="${OPENAI_API_KEY:-}" ;;
            claude) AI_KEY="${ANTHROPIC_API_KEY:-}" ;;
            deepseek) AI_KEY="${DEEPSEEK_API_KEY:-}" ;;
            *) echo "Unsupported AI_PROVIDER: $AI_PROVIDER"; exit 1 ;;
          esac
          if [ -z "$AI_KEY" ]; then
            echo "AI research skipped: no API key is configured. Rule-based research is populated by the separate no-cost backfill."
            exit 0
          fi
          nohup node scripts/neon-rest-api.mjs > /tmp/neon-rest.log 2>&1 &
          ready=false
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8787/rest/v1/stocks?limit=1' >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/neon-rest.log; exit 1; fi
          if [ "$RESEARCH_MODE" = "quarterly" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/generate_ai_research.mjs quarterly
          else
            node scripts/generate_ai_research.mjs monthly
          fi
