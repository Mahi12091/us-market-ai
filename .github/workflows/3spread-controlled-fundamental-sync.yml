name: 3spread Controlled Fundamental Sync
# Data sync: 3spread statements and normalized fundamentals

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_fundamentals_3spread.mjs'
      - '.github/workflows/3spread-controlled-fundamental-sync.yml'

permissions:
  contents: read

concurrency:
  group: 3spread-fundamental-sync
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      THREESPREAD_API_KEY2: ${{ secrets.THREESPREAD_API_KEY2 }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_3SPREAD_METRICS_RATIOS: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate secrets
        run: |
          set -euo pipefail
          for name in THREESPREAD_API_KEY2 SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured."; exit 1; fi
          done
      - name: Run full active-universe fundamental sync
        run: node scripts/sync_fundamentals_3spread.mjs
