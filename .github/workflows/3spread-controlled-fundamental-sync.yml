name: 3spread Controlled Fundamental Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3spread-fundamental-sync
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      THREESPREAD_API_KEY2: ${{ secrets.THREESPREAD_API_KEY2 }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate secrets
        run: |
          set -euo pipefail
          for name in THREESPREAD_API_KEY2 NEON_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured."; exit 1; fi
          done
      - name: Apply Neon schema
        run: node scripts/migrate_neon.mjs
      - name: Verify existing stock universe
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.NEON_DATABASE_URL);
          const rows = await sql`SELECT COUNT(*)::int AS total, COUNT(*) FILTER (WHERE is_active)::int AS active FROM public.stocks WHERE asset_type='stock'`;
          console.log(JSON.stringify(rows[0]));
          if (!rows[0] || Number(rows[0].total) < 5000) process.exit(1);
          NODE
      - name: Run compact 3spread normalized sync
        run: node scripts/sync_fundamentals_3spread_compact.mjs
      - name: Verify normalized data
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.NEON_DATABASE_URL);
          for (const table of ['financial_statements','fundamentals']) {
            const rows = await sql.query(`SELECT COUNT(*)::bigint AS rows FROM public.${table} WHERE data_source='3spread'`);
            console.log(`${table}: ${rows[0]?.rows ?? 0}`);
          }
          NODE
