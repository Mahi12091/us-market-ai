name: 3spread Controlled Fundamental Sync

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: 'Batch number (1-based, 250 stocks each)'
        required: false
        default: '1'
      batch_size:
        description: 'Stocks per run'
        required: false
        default: '250'

permissions:
  contents: read

concurrency:
  group: 3spread-fundamental-sync
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      THREESPREAD_API_KEY: ${{ secrets.THREESPREAD_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEON_REST_URL: http://127.0.0.1:8787
      NEON_API_KEY: neon-local
      SYNC_3SPREAD_METRICS_RATIOS: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate secrets
        run: |
          set -euo pipefail
          for name in THREESPREAD_API_KEY NEON_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured."; exit 1; fi
          done
      - name: Apply Neon schema
        run: node scripts/migrate_neon.mjs
      - name: Start Neon REST API
        run: |
          nohup node scripts/neon-rest-api.mjs > /tmp/neon-rest.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8787/rest/v1/stocks?limit=1' >/dev/null 2>&1; then echo "[neon-rest] API ready"; exit 0; fi
            sleep 1
          done
          cat /tmp/neon-rest.log
          exit 1
      - name: Verify existing stock universe
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.NEON_DATABASE_URL);
          const rows = await sql`SELECT COUNT(*)::int AS total, COUNT(*) FILTER (WHERE is_active)::int AS active FROM public.stocks WHERE asset_type='stock'`;
          console.log(JSON.stringify(rows[0]));
          if (!rows[0] || Number(rows[0].total) < 5000) process.exit(1);
          NODE
      - name: Patch normalized financial upsert for duplicate-safe execution
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/sync_fundamentals_3spread_v2.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replaceAll('THREESPREAD_API_KEY2', 'THREESPREAD_API_KEY');
          const oldCall = "await upsertBatch('financial_statements',normalized,'stock_id,statement_type,period_type,fiscal_period');";
          const newCall = "for (const row of normalized) await upsertBatch('financial_statements',[row],'stock_id,statement_type,period_type,fiscal_period',1);";
          if (source.includes(oldCall)) source = source.replace(oldCall, newCall);
          fs.writeFileSync(path, source);
          console.log('[3spread] primary API key configured; normalized financial upsert is conflict-safe');
          NODE
      - name: Run true-resumable 3spread sync
        env:
          SYNC_BATCH_NUMBER: ${{ inputs.batch_number }}
          SYNC_BATCH_SIZE_INPUT: ${{ inputs.batch_size }}
          SYNC_BATCH_DELAY_MS: '75'
        run: node scripts/run_3spread_resumable.mjs
      - name: Verify 3spread raw tables and resumable progress
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.NEON_DATABASE_URL);
          for (const table of ['threespread_financial_statements','threespread_statement_line_items','threespread_metrics','threespread_ratios','financial_statements','fundamentals','three_spread_sync_progress']) {
            const rows = await sql.query(`SELECT COUNT(*)::int AS rows FROM public.${table}`);
            console.log(`${table}: ${rows[0]?.rows ?? 0}`);
          }
          NODE
