name: 3spread Controlled Fundamental Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3spread-fundamental-sync
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      THREESPREAD_API_KEY2: ${{ secrets.THREESPREAD_API_KEY2 }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SUPABASE_URL: http://127.0.0.1:8787
      SUPABASE_SERVICE_ROLE_KEY: neon-compat
      SYNC_3SPREAD_METRICS_RATIOS: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate secrets
        run: |
          set -euo pipefail
          for name in THREESPREAD_API_KEY2 NEON_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured."; exit 1; fi
          done
      - name: Apply Neon schema
        run: node scripts/migrate_neon.mjs
      - name: Start Neon REST compatibility layer
        run: |
          nohup node scripts/neon-rest-proxy.mjs > /tmp/neon-rest.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/rest/v1/stocks?limit=1 >/dev/null 2>&1; then
              echo "[neon-rest] proxy ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/neon-rest.log
          exit 1
      - name: Refresh 2,000-stock universe
        run: node scripts/seed_us_stock_universe.mjs
      - name: Run active-universe 3spread statement sync
        continue-on-error: true
        run: node scripts/sync_fundamentals_3spread.mjs

      - name: Verify 3spread raw tables
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.NEON_DATABASE_URL);
          for (const table of ['threespread_financial_statements','threespread_statement_line_items','threespread_metrics','threespread_ratios']) {
            const rows = await sql.query(`SELECT COUNT(*)::int AS rows FROM public.${table}`);
            console.log(`${table}: ${rows[0]?.rows ?? 0}`);
          }
          NODE
