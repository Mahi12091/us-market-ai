name: Stock Metadata Enrichment

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/enrich_stock_metadata.mjs'
      - '.github/workflows/stock-metadata-enrichment.yml'

permissions:
  contents: read

concurrency:
  group: us-market-ai-stock-metadata-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      MASSIVE_DETAILS_BATCH_SIZE: '250'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in MASSIVE_API_KEY NEON_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured."; exit 1; fi
          done

      - name: Enrich missing stock metadata
        run: node scripts/enrich_stock_metadata.mjs

      - name: Verify metadata completion
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.NEON_DATABASE_URL);
          const rows = await sql.query(`SELECT
            COUNT(*) FILTER (WHERE is_active AND asset_type='stock') AS active_stocks,
            COUNT(*) FILTER (WHERE is_active AND asset_type='stock' AND NULLIF(BTRIM(sector),'') IS NULL) AS missing_sector,
            COUNT(*) FILTER (WHERE is_active AND asset_type='stock' AND NULLIF(BTRIM(industry),'') IS NULL) AS missing_industry,
            COUNT(*) FILTER (WHERE is_active AND asset_type='stock' AND NULLIF(BTRIM(description),'') IS NULL) AS missing_description,
            COUNT(*) FILTER (WHERE is_active AND asset_type='stock' AND NULLIF(BTRIM(website_url),'') IS NULL) AS missing_website,
            COUNT(*) FILTER (WHERE is_active AND asset_type='stock' AND NULLIF(BTRIM(logo_url),'') IS NULL) AS missing_logo
            FROM public.stocks`);
          console.log(JSON.stringify(rows[0], null, 2));
          NODE
